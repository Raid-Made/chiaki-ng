name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y make perl python3-pip protobuf-compiler
          python3 -m pip install --user --break-system-packages protobuf grpcio-tools
          protoc --version

      - name: Prepare Android release version
        id: version
        shell: bash
        run: |
          major=$(sed -n 's/^set(CHIAKI_VERSION_MAJOR \([0-9][0-9]*\)).*/\1/p' CMakeLists.txt | head -n1)
          minor=$(sed -n 's/^set(CHIAKI_VERSION_MINOR \([0-9][0-9]*\)).*/\1/p' CMakeLists.txt | head -n1)
          patch=$(sed -n 's/^set(CHIAKI_VERSION_PATCH \([0-9][0-9]*\)).*/\1/p' CMakeLists.txt | head -n1)
          base_version="${major}.${minor}.${patch}"
          stamp=$(date -u +%Y%m%d%H%M)
          version_name="${base_version}-android.${stamp}"
          version_code=$(date -u +%s)
          release_tag="android-v${base_version}-${stamp}"
          asset_name="chiaki-ng-android-universal-${version_name}.apk"

          echo "CHIAKI_ANDROID_VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "CHIAKI_ANDROID_VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "APK_ASSET_NAME=${asset_name}" >> "$GITHUB_ENV"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Restore Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Android signing secrets are not configured. See ANDROID_RELEASE.md."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          CHIAKI_ANDROID_KEYSTORE: release.keystore
          CHIAKI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHIAKI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHIAKI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CHIAKI_ANDROID_VERSION_NAME: ${{ env.CHIAKI_ANDROID_VERSION_NAME }}
          CHIAKI_ANDROID_VERSION_CODE: ${{ env.CHIAKI_ANDROID_VERSION_CODE }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify and stage APK
        shell: bash
        run: |
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$source_apk" ]]; then
            echo "::error::Expected APK was not produced at $source_apk"
            exit 1
          fi

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$source_apk"

          mkdir -p release
          cp "$source_apk" "release/$APK_ASSET_NAME"
          sha256sum "release/$APK_ASSET_NAME" > "release/$APK_ASSET_NAME.sha256"

      - name: Publish GitHub Release for Komi
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            "release/$APK_ASSET_NAME" \
            "release/$APK_ASSET_NAME.sha256" \
            --target "$GITHUB_SHA" \
            --title "Chiaki-ng Android $CHIAKI_ANDROID_VERSION_NAME" \
            --notes "Unofficial Android build of chiaki-ng from Raid-Made/chiaki-ng.\n\nPackage: com.raidmade.chiaking\nVersion code: $CHIAKI_ANDROID_VERSION_CODE\nSource commit: $GITHUB_SHA\n\nThe APK is consistently signed using the fork's Android release key so Komi and Android can verify future updates." \
            --latest
